# Only Caddy publishes 80/443; every other service is reachable only by service name on the compose network.
services:
  api:
    build:
      context: ../../
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../../
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  registration:
    build:
      context: ../../
      dockerfile: deploy/docker/registration.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # Public hostname for automatic HTTPS; set DOMAIN in .env. Defaults to localhost (self-signed).
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - registration

  tests:
    build:
      context: ../../
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - ../../.env
    command: ["pytest", "-q", "tests/unit"]
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: prism
      RABBITMQ_DEFAULT_PASS: prism
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
