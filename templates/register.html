<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent-strong: #2563eb;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: var(--panel);
        border: 1px solid rgba(148,163,184,0.2);
        border-radius: 14px;
        padding: 24px;
      }
      h1 { margin-top: 0; font-size: 1.3rem; }
      label { display: block; margin: 14px 0 6px; font-size: 0.85rem; color: var(--muted); }
      input {
        width: 100%;
        background: var(--panel-alt);
        border: 1px solid rgba(148,163,184,0.25);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 20px;
        background: var(--accent-strong);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .message { margin-top: 14px; font-size: 0.85rem; }
      .message.error { color: var(--danger); }
      .message.success { color: #22c55e; }
      .footer-link { margin-top: 16px; font-size: 0.85rem; color: var(--muted); text-align: center; }
      .footer-link a { color: #60a5fa; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create your account</h1>
      <form id="registerForm">
        <label for="email">Email</label>
        <input id="email" type="email" required maxlength="255" />

        <label for="username">Username</label>
        <input id="username" type="text" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_.\-]+" />

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" maxlength="72" />

        <button type="submit">Register</button>
      </form>
      <div id="formMessage" class="message"></div>
      <div class="footer-link">Already have an account? <a href="/ui/login">Log in</a></div>
    </div>

    <script>
      const registrationServiceUrl = {{ registration_service_url|tojson }};
      const form = document.getElementById('registerForm');
      const formMessage = document.getElementById('formMessage');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        formMessage.textContent = '';
        formMessage.className = 'message';

        const payload = {
          email: document.getElementById('email').value.trim(),
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        };

        try {
          const response = await fetch(`${registrationServiceUrl}/v1/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const body = await response.json();

          if (response.status === 409) {
            formMessage.textContent = `${body.detail} Redirecting to login…`;
            formMessage.className = 'message error';
            setTimeout(() => { window.location.href = body.redirect_url || '/ui/login'; }, 1500);
            return;
          }

          if (!response.ok) {
            throw new Error(body.detail || 'Registration failed');
          }

          formMessage.textContent = 'Account created. Redirecting to login…';
          formMessage.className = 'message success';
          setTimeout(() => { window.location.href = '/ui/login'; }, 1000);
        } catch (error) {
          formMessage.textContent = error.message || 'Registration failed';
          formMessage.className = 'message error';
        }
      });
    </script>
  </body>
</html>
