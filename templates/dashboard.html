<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-strong: #2563eb;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid rgba(148,163,184,0.2);
        padding: 20px 16px;
      }
      .sidebar h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }
      .room-list {
        list-style: none;
        padding: 0;
        margin: 20px 0 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .room-list a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--text);
        text-decoration: none;
        border: 1px solid rgba(148,163,184,0.2);
        border-radius: 10px;
        padding: 10px 12px;
        background: rgba(148,163,184,0.04);
      }
      .content {
        padding: 24px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .status-pill {
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.8rem;
        border: 1px solid rgba(96,165,250,0.5);
        color: var(--accent);
        background: rgba(96,165,250,0.08);
      }
      .panel {
        background: var(--panel);
        border: 1px solid rgba(148,163,184,0.2);
        border-radius: 14px;
        padding: 18px;
      }
      .composer {
        position: sticky;
        bottom: 0;
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
        padding: 12px 0 4px;
        background: var(--panel);
        border-top: 1px solid rgba(148,163,184,0.2);
      }
      .autoscroll-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .composer input {
        flex: 1;
        background: var(--panel-alt);
        border: 1px solid rgba(148,163,184,0.25);
        color: var(--text);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      .composer button {
        background: var(--accent-strong);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .feed {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 300px;
      }
      .room-label {
        min-width: 0;
      }
      .room-label .room-id {
        margin-top: 2px;
        font-size: 0.62rem;
        color: var(--muted);
        word-break: break-all;
      }
      .danger-button {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }
      .unread-dot.is-hidden {
        visibility: hidden;
      }
      .room-badges {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .admin-icon {
        color: var(--warning);
        font-size: 0.9rem;
        line-height: 1;
      }
      .unread-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
      }
      .message {
        position: relative;
        background: rgba(148,163,184,0.04);
        border: 1px solid rgba(148,163,184,0.16);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .author-name {
        font-weight: 700;
        font-size: 0.85rem;
      }
      .lang-flag {
        height: 12px;
        vertical-align: -1px;
        border-radius: 2px;
      }
      .receipts-popover {
        display: none;
        position: absolute;
        right: 12px;
        top: calc(100% - 6px);
        z-index: 20;
        min-width: 180px;
        max-width: 280px;
        background: var(--panel-alt);
        border: 1px solid rgba(148,163,184,0.3);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.78rem;
        box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      }
      .message:hover .receipts-popover { display: block; }
      .receipts-popover .group-title {
        color: var(--muted);
        text-transform: uppercase;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        margin: 4px 0 2px;
      }
      .receipts-popover .seen-user { color: var(--success); }
      .receipts-popover .unseen-user { color: var(--warning); }
      .message-header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .message-body {
        line-height: 1.5;
      }
      .message-body.is-translation {
        font-weight: 500;
      }
      .original-text {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        font-style: italic;
      }
      .translation {
        margin-top: 8px;
        background: rgba(34,197,94,0.06);
        border-left: 3px solid var(--success);
        border-radius: 8px;
        padding: 8px 10px;
        color: #d1fae5;
        font-size: 0.9rem;
      }
      .status-badge {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 0.72rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .status-badge.pending {
        background: rgba(96,165,250,0.12);
        color: var(--accent);
      }
      .status-badge.translated {
        background: rgba(34,197,94,0.12);
        color: var(--success);
      }
      .status-badge.partial {
        background: rgba(245,158,11,0.12);
        color: var(--warning);
      }
      .status-badge.unavailable {
        background: rgba(239,68,68,0.12);
        color: var(--danger);
      }
      .empty {
        color: var(--muted);
        padding: 18px;
      }
      .menu-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .menu-header h2 { margin: 0; }
      .menu-button {
        background: transparent;
        border: 1px solid rgba(148,163,184,0.25);
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .menu-button span {
        display: block;
        width: 18px;
        height: 2px;
        background: var(--text);
        border-radius: 2px;
      }
      .menu-panel {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 30;
        min-width: 170px;
        background: var(--panel-alt);
        border: 1px solid rgba(148,163,184,0.3);
        border-radius: 10px;
        padding: 6px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      }
      .menu-panel[hidden] { display: none; }
      .menu-panel button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--text);
        border: none;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .menu-panel button:hover { background: rgba(148,163,184,0.12); }
      dialog.popup {
        background: var(--panel);
        color: var(--text);
        border: 1px solid rgba(148,163,184,0.3);
        border-radius: 14px;
        padding: 20px;
        width: min(380px, 92vw);
      }
      dialog.popup::backdrop { background: rgba(0,0,0,0.6); }
      dialog.popup h3 {
        margin: 0 0 14px;
        font-size: 1rem;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 6px;
      }
      .dialog-actions button {
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }
      .dialog-actions button.apply-button {
        background: var(--success);
        color: #052e16;
      }
      .dialog-actions button.apply-button:disabled {
        background: #374151;
        color: #9ca3af;
        cursor: not-allowed;
      }
      .dialog-actions button.cancel-button {
        background: var(--danger);
        color: white;
      }
      .sidebar-section {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid rgba(148,163,184,0.2);
      }
      .sidebar-section h3 {
        margin: 0 0 10px;
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .sidebar-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sidebar-form input {
        background: var(--panel-alt);
        border: 1px solid rgba(148,163,184,0.25);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.9rem;
      }
      .sidebar-form select {
        background: var(--panel-alt);
        border: 1px solid rgba(148,163,184,0.25);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.9rem;
      }
      .sidebar-form button {
        background: var(--accent-strong);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }
      .form-note {
        font-size: 0.78rem;
        color: var(--muted);
        min-height: 1em;
      }
      .stats-panel {
        margin-bottom: 10px;
        padding: 8px 12px;
      }
      .stats-panel h3 {
        margin: 0;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
        gap: 6px;
        margin-top: 6px;
      }
      .stat-card {
        background: rgba(148,163,184,0.04);
        border: 1px solid rgba(148,163,184,0.16);
        border-radius: 6px;
        padding: 4px 8px;
      }
      .stat-card .label {
        font-size: 0.65rem;
        color: var(--muted);
      }
      .stat-card .value {
        font-size: 0.85rem;
        font-weight: 700;
        margin-top: 2px;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .member-inline form {
        flex-direction: row;
      }
      .member-inline input {
        width: 150px;
      }
      .member-inline input#addMemberLang {
        width: 70px;
      }
      @media (max-width: 800px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { border-right: none; border-bottom: 1px solid rgba(148,163,184,0.2); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="menu-header">
          <h2>Prism</h2>
          <button type="button" class="menu-button" id="menuButton" aria-label="Menu" aria-haspopup="true">
            <span></span><span></span><span></span>
          </button>
          <div class="menu-panel" id="menuPanel" hidden>
            <button type="button" id="menuCreate">Create room</button>
            <button type="button" id="menuJoin">Join room</button>
            <button type="button" id="menuSettings">Settings</button>
          </div>
        </div>
        <div class="status-pill" id="connectionState">No room selected</div>
        <ul class="room-list" id="roomList"></ul>

        <dialog class="popup" id="createRoomDialog">
          <h3>Create room</h3>
          <form id="createRoomForm" class="sidebar-form">
            <input id="createRoomName" type="text" placeholder="Room name" required maxlength="255" />
            <input id="createRoomLang" type="text" placeholder="Your language (e.g. en)" value="en" required minlength="2" maxlength="8" />
            <div id="createRoomNote" class="form-note"></div>
            <div class="dialog-actions">
              <button type="button" class="cancel-button">Cancel</button>
              <button type="submit" class="apply-button" disabled>Apply</button>
            </div>
          </form>
        </dialog>

        <dialog class="popup" id="joinRoomDialog">
          <h3>Join room</h3>
          <form id="joinRoomForm" class="sidebar-form">
            <input id="joinRoomId" type="text" placeholder="Room ID" required maxlength="64" />
            <input id="joinRoomLang" type="text" placeholder="Your language (e.g. en)" value="en" required minlength="2" maxlength="8" />
            <div id="joinRoomNote" class="form-note"></div>
            <div class="dialog-actions">
              <button type="button" class="cancel-button">Cancel</button>
              <button type="submit" class="apply-button" disabled>Apply</button>
            </div>
          </form>
        </dialog>

        <dialog class="popup" id="settingsDialog">
          <h3>Settings</h3>
          <form id="settingsForm" class="sidebar-form">
            <input id="settingsDisplayName" type="text" placeholder="Display name" maxlength="255" />
            <input id="settingsPreferredLang" type="text" placeholder="Default language (e.g. en)" required minlength="2" maxlength="8" />
            <div id="settingsNote" class="form-note"></div>
            <div class="form-note">Your user ID (share so a room owner can add you): <code id="ownUserId"></code></div>
            <div class="dialog-actions">
              <button type="button" class="cancel-button">Cancel</button>
              <button type="submit" class="apply-button" disabled>Apply</button>
            </div>
          </form>
        </dialog>
      </aside>

      <main class="content">
        <div class="topbar">
          <div class="topbar-left">
            <div>
              <h1 id="roomTitle">Dashboard</h1>
              <div class="form-note" id="roomIdNote" style="display: none;"></div>
            </div>
            <div class="member-inline" id="addMemberPanel" style="display: none;">
              <form id="addMemberForm" class="sidebar-form">
                <input id="addMemberUserId" type="text" placeholder="Add member: user ID" required maxlength="64" />
                <input id="addMemberLang" type="text" placeholder="Lang" value="en" required minlength="2" maxlength="8" />
                <button type="submit">Add</button>
              </form>
              <div id="addMemberNote" class="form-note"></div>
            </div>
            <button id="deleteRoomButton" class="danger-button" style="display: none;">Delete room</button>
          </div>
          <div class="status-pill" id="roomStatus">Ready</div>
        </div>

        <section class="panel stats-panel" id="statsPanel" style="display: none;">
          <h3>Room stats (owner view)</h3>
          <div class="stats-grid" id="statsGrid"></div>
        </section>

        <section class="panel" id="chatPanel">
          <div id="feed" class="feed"></div>
          <div id="sendNote" class="form-note"></div>
          <div class="composer">
            <input id="messageInput" type="text" placeholder="Type a message…" />
            <label class="autoscroll-toggle">
              <input type="checkbox" id="autoScrollToggle" /> Follow latest
            </label>
            <button id="sendButton">Send</button>
          </div>
        </section>

        <section class="panel" id="getStartedPanel" style="display: none;">
          <h3>Your rooms</h3>
          <div class="sidebar-form" style="max-width: 420px;">
            <select id="roomSelect">
              <option value="">Select a room you own or belong to…</option>
            </select>
            <button id="openRoomButton">Open room</button>
          </div>
          <p class="empty">Or use <strong>Create room</strong> or <strong>Join room</strong> in the sidebar to get started.</p>
        </section>
      </main>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const activeUserId = params.get('user_id') || 'dev-user';
      const activeToken = params.get('token') || 'dev-token';
      const roomId = {{ (room_id if room_id is defined and room_id else none)|tojson }};
      const roomName = {{ (room_name if room_name is defined and room_name else "Dashboard")|tojson }};
      const roomRole = {{ (room_role if room_role is defined and room_role else none)|tojson }};
      const roomPreferredLang = {{ (room_preferred_lang if room_preferred_lang is defined and room_preferred_lang else none)|tojson }};
      const wsBase = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}`;
      const state = {
        rooms: [],
        messages: [],
        socket: null,
      };

      const roomList = document.getElementById('roomList');
      const feed = document.getElementById('feed');
      const roomTitle = document.getElementById('roomTitle');
      const roomStatus = document.getElementById('roomStatus');
      const connectionState = document.getElementById('connectionState');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const sendNote = document.getElementById('sendNote');
      const createRoomForm = document.getElementById('createRoomForm');
      const createRoomNote = document.getElementById('createRoomNote');
      const joinRoomForm = document.getElementById('joinRoomForm');
      const joinRoomNote = document.getElementById('joinRoomNote');
      const settingsForm = document.getElementById('settingsForm');
      const settingsNote = document.getElementById('settingsNote');
      const statsPanel = document.getElementById('statsPanel');
      const statsGrid = document.getElementById('statsGrid');
      const roomSelect = document.getElementById('roomSelect');
      const openRoomButton = document.getElementById('openRoomButton');
      const ownUserId = document.getElementById('ownUserId');
      const roomIdNote = document.getElementById('roomIdNote');
      const addMemberPanel = document.getElementById('addMemberPanel');
      const addMemberForm = document.getElementById('addMemberForm');
      const addMemberNote = document.getElementById('addMemberNote');
      const deleteRoomButton = document.getElementById('deleteRoomButton');

      ownUserId.textContent = activeUserId;

      const autoScrollToggle = document.getElementById('autoScrollToggle');
      autoScrollToggle.checked = localStorage.getItem('prism:autoscroll') === '1';
      let lastUpdatedId = null;

      function scrollToLatestUpdated() {
        if (!autoScrollToggle.checked || !lastUpdatedId) return;
        const el = feed.querySelector(`[data-message-id="${CSS.escape(lastUpdatedId)}"]`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      autoScrollToggle.addEventListener('change', () => {
        localStorage.setItem('prism:autoscroll', autoScrollToggle.checked ? '1' : '0');
        scrollToLatestUpdated();
      });

      function roomQueryString() {
        const search = new URLSearchParams();
        search.set('user_id', activeUserId);
        search.set('token', activeToken);
        return search.toString();
      }

      function renderRooms() {
        roomList.innerHTML = '';
        roomSelect.innerHTML = '<option value="">Select a room you own or belong to…</option>';

        if (!state.rooms.length) {
          const li = document.createElement('li');
          li.className = 'empty';
          li.textContent = 'No rooms yet';
          roomList.appendChild(li);
          return;
        }

        for (const room of state.rooms) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          const roomUrl = `/ui/rooms/${room.room_id}?${roomQueryString()}`;
          link.href = roomUrl;
          const label = document.createElement('div');
          label.className = 'room-label';
          const nameEl = document.createElement('div');
          nameEl.textContent = room.name;
          const idEl = document.createElement('div');
          idEl.className = 'room-id';
          idEl.textContent = room.room_id;
          label.append(nameEl, idEl);
          link.appendChild(label);
          const badges = document.createElement('span');
          badges.className = 'room-badges';
          const dot = document.createElement('span');
          dot.className = room.has_unread ? 'unread-dot' : 'unread-dot is-hidden';
          if (room.has_unread) dot.title = `${room.unread_count} unread`;
          badges.appendChild(dot);
          if (room.role === 'admin') {
            const adminIcon = document.createElement('span');
            adminIcon.className = 'admin-icon';
            adminIcon.textContent = '\u2605';
            adminIcon.title = 'You are an admin of this room';
            badges.appendChild(adminIcon);
          }
          link.appendChild(badges);
          item.appendChild(link);
          roomList.appendChild(item);

          const option = document.createElement('option');
          option.value = room.room_id;
          option.textContent = `${room.name} (${room.role})`;
          roomSelect.appendChild(option);
        }
      }

      function userColor(userId) {
        let hash = 0;
        for (const ch of String(userId)) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
        return `hsl(${hash % 360}, 70%, 65%)`;
      }

      const flagFailed = new Set();
      function langBadge(lang) {
        const span = document.createElement('span');
        span.className = 'lang-badge';
        if (!lang || flagFailed.has(lang)) {
          span.textContent = lang || '';
          return span;
        }
        const img = document.createElement('img');
        img.className = 'lang-flag';
        img.alt = lang;
        img.title = lang;
        img.src = `/v1/flags/${encodeURIComponent(lang)}`;
        img.onerror = () => {
          flagFailed.add(lang);
          span.textContent = lang;
        };
        span.appendChild(img);
        return span;
      }

      const STATUS_BADGES = {
        original_only: { className: 'pending', label: 'Translating…' },
        translated: { className: 'translated', label: 'Translated' },
        partially_translated: { className: 'partial', label: 'Partially translated' },
        translation_unavailable: { className: 'unavailable', label: 'Translation unavailable' },
      };

      function renderMessages(options = {}) {
        seenObserver.disconnect();
        inView.clear();
        feed.innerHTML = '';
        if (!state.messages.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No messages yet in this room.';
          feed.appendChild(empty);
          return;
        }

        for (const message of [...state.messages].reverse()) {
          const card = document.createElement('div');
          card.className = 'message';
          card.dataset.messageId = message.message_id;
          card.appendChild(buildReceiptsPopover(message));
          if (isUnseenForMe(message)) seenObserver.observe(card);

          const badge = STATUS_BADGES[message.status] || STATUS_BADGES.original_only;
          const header = document.createElement('div');
          header.className = 'message-header';
          const authorEl = document.createElement('span');
          authorEl.className = 'author-name';
          authorEl.textContent = message.author_display_name || message.author_user_id;
          authorEl.style.color = userColor(message.author_user_id);
          const metaEl = document.createElement('span');
          const badgeEl = document.createElement('span');
          badgeEl.className = `status-badge ${badge.className}`;
          badgeEl.textContent = badge.label;
          metaEl.append(badgeEl, ` ${new Date(message.created_at).toLocaleString()}`);
          header.append(authorEl, metaEl);
          card.appendChild(header);

          const myTranslation = roomPreferredLang && message.translations ? message.translations[roomPreferredLang] : null;
          const needsTranslationForMe = roomPreferredLang && message.source_lang !== roomPreferredLang;
          const showingTranslation = !!myTranslation && needsTranslationForMe;

          const body = document.createElement('div');
          body.className = showingTranslation ? 'message-body is-translation' : 'message-body';
          body.textContent = (showingTranslation ? myTranslation.content : message.content_original) || '…';
          card.appendChild(body);

          if (showingTranslation) {
            const original = document.createElement('div');
            original.className = 'original-text';
            original.append('Original (', langBadge(message.source_lang), `): ${message.content_original}`);
            card.appendChild(original);
          } else if (needsTranslationForMe && message.status !== 'original_only') {
            // Status can read "Translated" even when no translation exists for *my* language —
            // that happens when this message predates my language being added to the room.
            const note = document.createElement('div');
            note.className = 'original-text';
            note.append('No translation available in your language (', langBadge(roomPreferredLang), ').');
            card.appendChild(note);
          }

          const otherTranslations = Object.entries(message.translations || {}).filter(([lang]) => lang !== roomPreferredLang);
          if (otherTranslations.length) {
            const list = document.createElement('div');
            list.className = 'translation';
            otherTranslations.forEach(([lang, value], index) => {
              if (index > 0) list.append(' | ');
              list.append(langBadge(lang), `: ${value.content}`);
            });
            card.appendChild(list);
          } else if (!showingTranslation && message.status === 'translation_unavailable') {
            const list = document.createElement('div');
            list.className = 'translation';
            list.style.background = 'rgba(239,68,68,0.06)';
            list.style.borderLeftColor = 'var(--danger)';
            list.style.color = '#fecaca';
            list.textContent = 'No translations available for this message.';
            card.appendChild(list);
          }

          feed.appendChild(card);
        }
        if (options.scroll !== false) scrollToLatestUpdated();
      }

      function setConnectionState(value) {
        connectionState.textContent = value;
      }

      let roomsFetchSeq = 0;
      async function fetchRooms() {
        const seq = ++roomsFetchSeq;
        try {
          const response = await fetch(`/v1/rooms?user_id=${encodeURIComponent(activeUserId)}`, {
            headers: { Authorization: `Bearer ${activeToken}` }
          });
          if (!response.ok) {
            throw new Error('rooms unavailable');
          }
          const rooms = await response.json();
          if (seq !== roomsFetchSeq) return;
          state.rooms = rooms;
          renderRooms();
        } catch (error) {
          console.error('Failed to load rooms', error);
        }
      }

      async function loadRoomMessages() {
        if (!roomId) return;

        try {
          const storageKey = `prism:last-message:${roomId}`;
          const lastMessageId = localStorage.getItem(storageKey);
          const shouldUseCursor = state.messages.length > 0 && !!lastMessageId;
          const url = new URL(`/v1/rooms/${roomId}/messages`, window.location.origin);
          url.searchParams.set('user_id', activeUserId);
          url.searchParams.set('limit', '50');
          if (shouldUseCursor) {
            url.searchParams.set('since_message_id', lastMessageId);
          }

          const response = await fetch(url.toString().replace(window.location.origin, ''), {
            headers: { Authorization: `Bearer ${activeToken}` }
          });
          if (!response.ok) {
            throw new Error('messages unavailable');
          }

          const messages = await response.json();
          if (messages.length) {
            const newest = messages[messages.length - 1];
            localStorage.setItem(storageKey, newest.message_id);
          }

          if (shouldUseCursor) {
            state.messages = [...state.messages.filter(item => !messages.some(msg => msg.message_id === item.message_id)), ...messages];
          } else {
            state.messages = [...messages];
          }

          state.messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
          lastUpdatedId = state.messages.length ? state.messages[state.messages.length - 1].message_id : null;
          renderMessages();
        } catch (error) {
          console.error('Failed to load room messages', error);
        }
      }

      function connectSocket() {
        if (!roomId) return;
        if (state.socket) {
          state.socket.close();
        }

        const socketUrl = `${wsBase}/ws/${roomId}?token=${encodeURIComponent(activeToken)}&user_id=${encodeURIComponent(activeUserId)}`;
        const socket = new WebSocket(socketUrl);
        state.socket = socket;

        socket.onopen = async () => {
          setConnectionState('Connected');
          roomStatus.textContent = 'Live';
          await loadRoomMessages();
        };

        socket.onmessage = (event) => {
          const payload = JSON.parse(event.data);
          if (payload.type === 'MessageCreated') {
            const message = payload.message;
            state.messages = [...state.messages.filter(item => item.message_id !== message.message_id), message];
            localStorage.setItem(`prism:last-message:${roomId}`, message.message_id);
            lastUpdatedId = message.message_id;
            renderMessages();
          }

          if (payload.type === 'MessageUpdated') {
            const existing = state.messages.find(item => item.message_id === payload.message_id);
            if (existing) {
              // translations_patch is always freshly computed and authoritative; translations
              // may lag behind it, so merge with translations_patch taking priority.
              existing.translations = { ...(payload.translations || {}), ...(payload.translations_patch || {}) };
              existing.status = payload.status;
              if (payload.receipts) existing.receipts = payload.receipts;
              lastUpdatedId = payload.message_id;
            }
            renderMessages();
          }

          if (payload.type === 'RoomDeleted') {
            window.location.href = `/ui?${roomQueryString()}`;
            return;
          }

          if (payload.type === 'MessageSeen') {
            applySeenEvent(payload);
            renderMessages({ scroll: false });
          }
        };

        socket.onclose = () => {
          setConnectionState('Disconnected');
          roomStatus.textContent = 'Reconnecting…';
          setTimeout(connectSocket, 2000);
        };

        socket.onerror = () => {
          setConnectionState('Error');
        };
      }

      async function sendMessage() {
        if (!roomId) return;
        const content = messageInput.value.trim();
        if (!content) return;

        sendNote.textContent = '';
        const payload = {
          author_user_id: activeUserId,
          room_id: roomId,
          client_message_id: `ui-${Date.now()}`,
          source_lang: 'en',
          content_original: content,
        };

        try {
          const response = await fetch(`/v1/messages?user_id=${encodeURIComponent(activeUserId)}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${activeToken}`
            },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || `Send failed (${response.status})`);
          }
          messageInput.value = '';
        } catch (error) {
          console.error('Failed to send message', error);
          sendNote.textContent = error.message || 'Failed to send message';
        }
      }

      const menuButton = document.getElementById('menuButton');
      const menuPanel = document.getElementById('menuPanel');
      menuButton.addEventListener('click', (event) => {
        event.stopPropagation();
        menuPanel.hidden = !menuPanel.hidden;
      });
      document.addEventListener('click', () => { menuPanel.hidden = true; });

      function setupPopup(dialogId, openButtonId, form, note) {
        const dialog = document.getElementById(dialogId);
        const applyButton = form.querySelector('.apply-button');
        const fields = [...form.querySelectorAll('input')];
        let initial = [];
        const refresh = () => {
          applyButton.disabled = !fields.some((field, index) => field.value !== initial[index]);
        };
        fields.forEach(field => field.addEventListener('input', refresh));
        document.getElementById(openButtonId).addEventListener('click', () => {
          menuPanel.hidden = true;
          form.reset();
          note.textContent = '';
          initial = fields.map(field => field.value);
          refresh();
          dialog.showModal();
        });
        form.querySelector('.cancel-button').addEventListener('click', () => dialog.close());
        dialog.addEventListener('close', () => {
          form.reset();
          note.textContent = '';
        });
        return dialog;
      }

      setupPopup('createRoomDialog', 'menuCreate', createRoomForm, createRoomNote);
      setupPopup('joinRoomDialog', 'menuJoin', joinRoomForm, joinRoomNote);
      const settingsDialog = setupPopup('settingsDialog', 'menuSettings', settingsForm, settingsNote);

      createRoomForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        createRoomNote.textContent = '';
        const name = document.getElementById('createRoomName').value.trim();
        const preferredLang = document.getElementById('createRoomLang').value.trim();

        try {
          const response = await fetch(`/v1/rooms?${roomQueryString()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${activeToken}` },
            body: JSON.stringify({ name, preferred_lang: preferredLang }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || 'Failed to create room');

          createRoomForm.reset();
          document.getElementById('createRoomLang').value = 'en';
          window.location.href = `/ui/rooms/${body.room_id}?${roomQueryString()}`;
        } catch (error) {
          createRoomNote.textContent = error.message;
        }
      });

      joinRoomForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        joinRoomNote.textContent = '';
        const targetRoomId = document.getElementById('joinRoomId').value.trim();
        const preferredLang = document.getElementById('joinRoomLang').value.trim();

        try {
          const response = await fetch(`/v1/rooms/${encodeURIComponent(targetRoomId)}/join?${roomQueryString()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${activeToken}` },
            body: JSON.stringify({ preferred_lang: preferredLang }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || 'Failed to join room');

          window.location.href = `/ui/rooms/${body.room_id}?${roomQueryString()}`;
        } catch (error) {
          joinRoomNote.textContent = error.message;
        }
      });

      settingsForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        settingsNote.textContent = '';
        const displayName = document.getElementById('settingsDisplayName').value.trim();
        const preferredLang = document.getElementById('settingsPreferredLang').value.trim();

        try {
          const response = await fetch(`/v1/users?${roomQueryString()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${activeToken}` },
            body: JSON.stringify({ display_name: displayName || null, preferred_lang: preferredLang }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || 'Failed to save settings');

          settingsDialog.close();
        } catch (error) {
          settingsNote.textContent = error.message;
        }
      });

      function renderStats(summary) {
        statsGrid.innerHTML = '';
        const entries = [
          ['Messages', summary.totals?.messages ?? 0],
          ['Translations', summary.totals?.translations ?? 0],
          ['Success rate', summary.totals?.success_rate != null ? `${Math.round(summary.totals.success_rate * 100)}%` : '—'],
          ['Est. cost (USD)', summary.totals?.estimated_cost_usd != null ? `$${summary.totals.estimated_cost_usd.toFixed(2)}` : '—'],
          ['Queue p95 (ms)', summary.latency_ms?.queue_p95 ?? '—'],
          ['End-to-end p95 (ms)', summary.latency_ms?.end_to_end_p95 ?? '—'],
        ];
        for (const [label, value] of entries) {
          const card = document.createElement('div');
          card.className = 'stat-card';
          card.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
          statsGrid.appendChild(card);
        }
      }

      async function loadRoomStats() {
        if (!roomId || roomRole !== 'admin') return;
        try {
          const response = await fetch(`/v1/admin/rooms/${roomId}/metrics?${roomQueryString()}`, {
            headers: { Authorization: `Bearer ${activeToken}` },
          });
          if (!response.ok) throw new Error('stats unavailable');
          const summary = await response.json();
          statsPanel.style.display = 'block';
          renderStats(summary);
        } catch (error) {
          console.error('Failed to load room stats', error);
        }
      }

      addMemberForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        addMemberNote.textContent = '';
        const memberUserId = document.getElementById('addMemberUserId').value.trim();
        const preferredLang = document.getElementById('addMemberLang').value.trim();

        try {
          const response = await fetch(`/v1/rooms/${roomId}/members?${roomQueryString()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${activeToken}` },
            body: JSON.stringify({ user_id: memberUserId, preferred_lang: preferredLang }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || 'Failed to add member');

          addMemberForm.reset();
          document.getElementById('addMemberLang').value = 'en';
          addMemberNote.textContent = `Added ${memberUserId} to the room.`;
        } catch (error) {
          addMemberNote.textContent = error.message;
        }
      });

      sendButton.addEventListener('click', sendMessage);
      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });

      openRoomButton.addEventListener('click', () => {
        if (!roomSelect.value) return;
        window.location.href = `/ui/rooms/${roomSelect.value}?${roomQueryString()}`;
      });
      roomSelect.addEventListener('change', () => openRoomButton.click());

      if (roomId) {
        roomTitle.textContent = roomName || 'Room';
        roomIdNote.textContent = `Room ID: ${roomId} (share this so others can join)`;
        roomIdNote.style.display = 'block';
        if (roomRole === 'admin') {
          addMemberPanel.style.display = 'block';
          deleteRoomButton.style.display = 'inline-block';
        }
        setConnectionState('Connecting…');
        connectSocket();
        loadRoomStats();
      } else {
        roomTitle.textContent = 'Dashboard';
        document.getElementById('chatPanel').style.display = 'none';
        document.getElementById('getStartedPanel').style.display = 'block';
      }

      function isUnseenForMe(message) {
        if (message.author_user_id === activeUserId) return false;
        return (message.receipts?.unseen || []).some(entry => entry.user_id === activeUserId);
      }

      function buildReceiptsPopover(message) {
        const popover = document.createElement('div');
        popover.className = 'receipts-popover';
        const receipts = message.receipts || { seen: [], unseen: [] };
        const groups = [
          ['Seen', receipts.seen || [], 'seen-user'],
          ['Not seen yet', receipts.unseen || [], 'unseen-user'],
        ];
        for (const [title, users, className] of groups) {
          const heading = document.createElement('div');
          heading.className = 'group-title';
          heading.textContent = title;
          popover.appendChild(heading);
          if (!users.length) {
            const none = document.createElement('div');
            none.textContent = '—';
            popover.appendChild(none);
          }
          for (const user of users) {
            const row = document.createElement('div');
            row.className = className;
            row.textContent = user.display_name || user.user_id;
            popover.appendChild(row);
          }
        }
        return popover;
      }

      function applySeenEvent(payload) {
        for (const messageId of payload.message_ids || []) {
          const message = state.messages.find(item => item.message_id === messageId);
          if (!message || !message.receipts) continue;
          const wasListed = message.receipts.unseen.find(entry => entry.user_id === payload.user_id)
            || message.receipts.seen.find(entry => entry.user_id === payload.user_id);
          message.receipts.unseen = message.receipts.unseen.filter(entry => entry.user_id !== payload.user_id);
          message.receipts.seen = message.receipts.seen.filter(entry => entry.user_id !== payload.user_id);
          if (wasListed) {
            message.receipts.seen.push({
              user_id: payload.user_id,
              display_name: payload.display_name || wasListed.display_name || null,
              seen_at: payload.seen_at,
            });
          }
        }
      }

      const inView = new Set();
      const inFlightSeen = new Set();
      let seenTimer = null;

      const seenObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          const id = entry.target.dataset.messageId;
          if (entry.isIntersecting) inView.add(id); else inView.delete(id);
        }
        scheduleSeenFlush();
      }, { threshold: 0.5 });

      function scheduleSeenFlush() {
        if (seenTimer) return;
        seenTimer = setTimeout(flushSeen, 500);
      }

      async function flushSeen() {
        seenTimer = null;
        if (!roomId || document.visibilityState !== 'visible' || !document.hasFocus()) return;
        const ids = state.messages
          .filter(message => inView.has(message.message_id) && !inFlightSeen.has(message.message_id) && isUnseenForMe(message))
          .map(message => message.message_id);
        if (!ids.length) return;

        ids.forEach(id => inFlightSeen.add(id));
        try {
          const response = await fetch(`/v1/rooms/${encodeURIComponent(roomId)}/messages/seen`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${activeToken}` },
            body: JSON.stringify({ message_ids: ids.slice(0, 200) }),
          });
          if (!response.ok) throw new Error('seen failed');
        } catch (error) {
          console.error('Failed to mark messages seen', error);
        } finally {
          ids.forEach(id => inFlightSeen.delete(id));
        }
      }

      window.addEventListener('focus', scheduleSeenFlush);
      document.addEventListener('visibilitychange', scheduleSeenFlush);

      deleteRoomButton.addEventListener('click', async () => {
        if (!roomId) return;
        if (!confirm(`Delete room "${roomName}" and all its messages? This cannot be undone.`)) return;
        try {
          const response = await fetch(`/v1/rooms/${encodeURIComponent(roomId)}?${roomQueryString()}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${activeToken}` },
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.detail || 'Failed to delete room');
          }
          window.location.href = `/ui?${roomQueryString()}`;
        } catch (error) {
          sendNote.textContent = error.message;
        }
      });

      let roomsRefreshTimer = null;
      function connectUserSocket() {
        const socket = new WebSocket(`${wsBase}/ws/user?token=${encodeURIComponent(activeToken)}`);
        socket.onmessage = (event) => {
          const payload = JSON.parse(event.data);
          if (payload.type !== 'RoomUnreadHint') return;
          clearTimeout(roomsRefreshTimer);
          roomsRefreshTimer = setTimeout(fetchRooms, 300);
        };
        socket.onopen = () => fetchRooms();
        socket.onclose = () => setTimeout(connectUserSocket, 3000);
      }
      connectUserSocket();

      // Safety net for hints missed while the user socket was down.
      setInterval(fetchRooms, 30000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchRooms();
      });

      fetchRooms();
    </script>
  </body>
</html>
